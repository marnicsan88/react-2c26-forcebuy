<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Metallic & Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="30%" stop-color="#fef2b8"/>
      <stop offset="70%" stop-color="#997214"/>
      <stop offset="100%" stop-color="#e2c463"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8392a0"/>
      <stop offset="50%" stop-color="#f2f7fc"/>
      <stop offset="100%" stop-color="#4a5763"/>
    </linearGradient>

    <!-- Blade Filters & Glows -->
    <filter id="bladeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feGaussianBlur stdDeviation="35" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- NOTA: Sin rectángulo de fondo (Fondo 100% transparente) -->

  <!-- Outer Emblem Frame (Large Circular Rings) con el círculo principal intacto -->
  <g id="emblem-frame" transform="translate(400, 400)">
    <!-- Outer Gold Ring -->
    <circle cx="0" cy="0" r="330" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    
    <!-- Middle Dark Spacer Ring (simulando profundidad transparente) -->
    <circle cx="0" cy="0" r="310" fill="none" stroke="transparent" stroke-width="8"/>
    <circle cx="0" cy="0" r="298" fill="none" stroke="url(#silverGrad)" stroke-width="16"/>
    
    <!-- Inner Gold Ring -->
    <circle cx="0" cy="0" r="282" fill="none" stroke="transparent" stroke-width="6"/>
    <circle cx="0" cy="0" r="274" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>

    <!-- Cardinal Chevrons / Corner Accents -->
    <g id="cardinal-accents">
      <!-- Top -->
      <path d="M -32 -330 L 0 -304 L 32 -330 L 16 -330 L 0 -316 L -16 -330 Z" fill="url(#goldGrad)"/>
      <path d="M -44 -298 L 0 -264 L 44 -298" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
      <!-- Bottom -->
      <path d="M -44 298 L 0 264 L 44 298" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
      <!-- Left -->
      <path d="M -298 -44 L -264 0 L -298 44" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
      <!-- Right -->
      <path d="M 298 -44 L 264 0 L 298 44" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
    </g>

    <!-- Diagonal Accents -->
    <g id="diagonal-accents" transform="rotate(45)">
      <path d="M -38 -298 L 0 -268 L 38 -298" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M -38 298 L 0 268 L 38 298" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M -298 -38 L -268 0 L -298 38" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 298 -38 L 268 0 L 298 38" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- MAIN ASSEMBLY: LIGHTSABER ONLY (CENTRED & ROTATED) -->
  <g id="lightsaber-only" transform="translate(265, 535) rotate(-45)">

    <!-- 1. LIGHTSABER BLADE -->
    <g id="blade">
      <!-- Deep Blue Outer Ambient Aura -->
      <path d="M 160 -32 L 530 -22 C 565 -16 585 -8 595 0 C 585 8 565 16 530 22 L 160 32 Z" fill="#0066ff" opacity="0.85" filter="url(#bladeGlow)"/>
      
      <!-- Bright Cyan Mid Blade -->
      <path d="M 160 -18 L 535 -12 C 560 -8 575 -4 582 0 C 575 4 560 8 535 12 L 160 18 Z" fill="#50c8ff" filter="url(#softGlow)"/>
      
      <!-- Intense White Core -->
      <path d="M 160 -9 L 542 -6 C 556 -4 568 -1 574 0 C 568 1 556 4 542 6 L 160 9 Z" fill="#ffffff"/>
    </g>

    <!-- 2. ELECTRICITY ARCS & PLASMA SPARKS -->
    <g id="lightning-arcs" stroke="#b0f0ff" stroke-width="2.2" fill="none" filter="url(#softGlow)">
      <path d="M 170 -14 Q 210 -42 250 -18 T 330 -48 T 420 -20 T 500 -40"/>
      <path d="M 200 16 Q 240 42 300 20 T 390 45 T 480 14 T 540 32"/>
      <path d="M 260 -10 Q 310 32 370 -6 T 460 28 T 550 -15"/>

      <path d="M 180 -20 L 200 -36 L 216 -24 L 240 -46 L 255 -28" stroke-width="2"/>
      <path d="M 310 20 L 330 42 L 350 25 L 370 48 L 390 28" stroke-width="2"/>
      <path d="M 430 -24 L 450 -48 L 472 -28 L 490 -52" stroke-width="2"/>

      <circle cx="210" cy="-34" r="3.5" fill="#ffffff"/>
      <circle cx="270" cy="34" r="3" fill="#70d6ff"/>
      <circle cx="350" cy="-42" r="4" fill="#ffffff"/>
      <circle cx="410" cy="38" r="2.5" fill="#70d6ff"/>
      <circle cx="470" cy="-30" r="3.5" fill="#ffffff"/>
      <circle cx="530" cy="24" r="3" fill="#70d6ff"/>

      <polygon points="230,24 244,15 246,30" fill="#b0f0ff"/>
      <polygon points="370,-26 384,-35 380,-18" fill="#ffffff"/>
      <polygon points="490,16 504,8 500,24" fill="#b0f0ff"/>
    </g>

    <!-- 3. LIGHTSABER HILT -->
    <g id="hilt">
      <path d="M -210 -15 L -175 -20 L -165 -20 L -165 20 L -175 20 L -210 15 Z" fill="url(#silverGrad)" stroke="#1a202c" stroke-width="2"/>
      <rect x="-200" y="-14" width="22" height="28" rx="2" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>

      <rect x="-165" y="-18" width="135" height="36" rx="3" fill="url(#silverGrad)" stroke="#1a202c" stroke-width="2"/>
      <rect x="-152" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>
      <rect x="-132" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>
      <rect x="-112" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>
      <rect x="-92" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>
      <rect x="-72" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>
      <rect x="-52" y="-20" width="12" height="40" rx="2" fill="#181d24" stroke="#0d1014" stroke-width="1.2"/>

      <rect x="-30" y="-20" width="80" height="40" fill="url(#silverGrad)" stroke="#1a202c" stroke-width="2"/>
      <rect x="-10" y="-28" width="32" height="10" rx="2" fill="#4a5568" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="6" cy="-20" r="6" fill="#e53e3e" stroke="#8b0000" stroke-width="1.5"/>
      <circle cx="4" cy="-22" r="2" fill="#ffaaaa"/>
      <rect x="28" y="-25" width="14" height="8" fill="#dd6b20"/>

      <rect x="50" y="-19" width="85" height="38" fill="url(#silverGrad)" stroke="#1a202c" stroke-width="2"/>
      <rect x="70" y="-20" width="40" height="40" fill="#2d3748"/>

      <path d="M 135 -20 L 175 -28 L 188 -24 L 188 24 L 175 28 L 135 20 Z" fill="url(#silverGrad)" stroke="#1a202c" stroke-width="2"/>
      <rect x="172" y="-22" width="18" height="44" fill="#12161c"/>
      <circle cx="150" cy="-15" r="4.5" fill="#e53e3e"/>
    </g>

  </g>
</svg>